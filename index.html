<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Site</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
  <img>
  <p></p>

  <button class="btn-yes" onclick="goYes()"></button>
  <button class="btn-no" onclick="goNo()"></button>
</div>

<!-- PAGE NON -->
<div id="pageNon" class="page">
  <img>
  <p></p>

  <div class="choice-container">
    <button class="c1" onclick="goChoice1()"></button>
    <button class="c2" onclick="goChoice2()"></button>
  </div>

  <button class="back-btn" onclick="goBack()">← Retour</button>
</div>

<!-- NON CHOIX -->
<div id="pageNonChoice1" class="page">
  <p>Texte choix 1</p>
  <button class="back-btn" onclick="goBack()">← Retour</button>
</div>

<div id="pageNonChoice2" class="page">
  <p>Texte choix 2</p>
  <button class="back-btn" onclick="goBack()">← Retour</button>
</div>

<!-- PAGE OUI -->
<div id="pageOui" class="page">
  <img>
  <p></p>

  <input id="inputText" placeholder="Écris ici...">

  <button onclick="sendStep1()">Suivant</button>

  <button class="back-btn" onclick="goBack()">← Retour</button>
</div>

<!-- STEP 2 -->
<div id="pageOuiStep2" class="page">

  <p>Choisis :</p>

  <div class="choice-container">
    <button id="opt1" onclick="selectOption('A')"></button>
    <button id="opt2" onclick="selectOption('B')"></button>
  </div>

  <button class="back-btn" onclick="goBack()">← Retour</button>
</div>

<!-- FINAL 🔴 FIX -->
<div id="finalPage" class="page">
  <p></p>
</div>

<script src="config.js"></script>
<script src="script.js"></script>

</body>
</html>
