<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Date</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
  <img src="img1.jpg">
  <p>TON TEXTE PAGE 1</p>

  <button onclick="goYes()">Oui</button>
  <button onclick="goNo()">Non</button>
</div>

<!-- PAGE NON -->
<div id="pageNon" class="page">
  <img src="img2.jpg">
  <p>TON TEXTE PAGE NON</p>

  <button onclick="goChoice1()">Choix 1</button>
  <button onclick="goChoice2()">Choix 2</button>

  <button onclick="goBack()">Retour</button>
</div>

<!-- CHOIX 1 -->
<div id="pageNonChoice1" class="page">
  <img src="img2.jpg">
  <p>Texte choix 1</p>

  <button onclick="goBack()">Revenir</button>
</div>

<!-- CHOIX 2 -->
<div id="pageNonChoice2" class="page">
  <img src="img2.jpg">
  <p>Texte choix 2</p>

  <button onclick="goBack()">Revenir</button>
</div>

<!-- PAGE OUI -->
<div id="pageOui" class="page">
  <img src="img3.jpg">
  <p>TON TEXTE PAGE OUI</p>

  <input id="inputText" placeholder="Écris ici...">
  <br><br>

  <button onclick="sendStep1()">Suivant</button>
  <button onclick="goBack()">Retour</button>
</div>

<!-- STEP 2 -->
<div id="pageOuiStep2" class="page">
  <p>Choisis une option</p>

  <button onclick="selectOption('Option A')">Option A</button>
  <button onclick="selectOption('Option B')">Option B</button>

  <button onclick="goBack()">Retour</button>
</div>

<!-- FINAL -->
<div id="finalPage" class="page">
  <p>Merci ❤️</p>
</div>

<script src="config.js"></script>
<script src="script.js"></script>

</body>
</html>
