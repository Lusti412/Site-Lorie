<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Date</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page active">
  <img>
  <p></p>

  <button class="btn-yes" onclick="goYes()"></button>
  <button class="btn-no" onclick="goNo()"></button>
</div>

<!-- PAGE NON -->
<div id="pageNon" class="page">
  <img>
  <p></p>

  <button class="c1" onclick="goChoice1()">Choix 1</button>
  <button class="c2" onclick="goChoice2()">Choix 2</button>

  <button class="back-btn" onclick="goBack()">← Retour</button>
</div>

<!-- CHOIX 1 -->
<div id="pageNonChoice1" class="page">
  <img>
  <p></p>

  <button class="back-btn" onclick="goBack()">← Retour</button>
</div>

<!-- CHOIX 2 -->
<div id="pageNonChoice2" class="page">
  <img>
  <p></p>

  <button class="back-btn" onclick="goBack()">← Retour</button>
</div>

<!-- OUI -->
<div id="pageOui" class="page">
  <img>
  <p></p>

  <input id="inputText" placeholder="Écris ici...">

  <button onclick="sendStep1()">Suivant</button>
  <button class="back-btn" onclick="goBack()">← Retour</button>
</div>

<!-- STEP 2 -->
<div id="pageOuiStep2" class="page">
  <p>Choisis</p>

  <button onclick="selectOption('A')">Option A</button>
  <button onclick="selectOption('B')">Option B</button>

  <button class="back-btn" onclick="goBack()">← Retour</button>
</div>

<!-- FINAL -->
<div id="finalPage" class="page">
  <p>Merci ❤️</p>
</div>

<script src="config.js"></script>
<script src="script.js"></script>

</body>
</html>
